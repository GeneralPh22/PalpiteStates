kind = "web"
previewPath = "/"
title = "PalpiteStats"
version = "1.0.0"
id = "artifacts/palpite-stats"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24499
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/palpite-stats run dev"

[services.env]
PORT = "24499"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/palpite-stats", "run", "build"]
publicDir = "artifacts/palpite-stats/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
